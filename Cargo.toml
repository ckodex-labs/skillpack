[workspace]
resolver = "2"
members = [
    "crates/skillpack-domain",
    "crates/skillpack-application",
    "crates/skillpack-adapters",
    "crates/skillpack-api",
    "crates/skillpack-proto",
    "crates/skillpack-fabricator",
    "crates/skillpack-cni",
    "crates/skillpack-registry-sync",
    "crates/skillpack-tests",
    "crates/xtask",
]
exclude = [".dagger"]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ckodex/skillpack"

[workspace.dependencies]
# Core
anyhow = "1.0.102"
thiserror = "2.0.18"
async-trait = "0.1.89"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# serde_yaml is unmaintained and archived upstream (tracking issue
# rustsec/advisory-db#2132; no advisory has been filed yet). serde_yaml_ng is
# the actively maintained fork. Workspace-level rename keeps use-sites unchanged.
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }

# CLI
clap = { version = "4.6.1", features = ["derive", "color", "env"] }
colored = "3.1.1"

# Async
tokio = { version = "1.52.3", features = ["full"] }

# gRPC
tonic = "0.14.6"
prost = "0.14.3"
tonic-build = "0.14.6"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Filesystem
walkdir = "2.5.0"
notify = "7.0"
tar = "0.4.46"
flate2 = "1.1.9"
bzip2 = "0.6.1"
brotli = "8.0.2"
zstd = "0.13.3"
zip = "8.6.0"

# Crypto
sha2 = "0.11.0"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Regex
regex = "1.12.3"

# Parallelism
rayon = "1.12.0"

# MCP
mcp-server = "0.1.0"

# OCI Distribution (ORAS rust-oci-client)
# https://github.com/oras-project/rust-oci-client/releases/tag/v0.16.0
oci-client = "0.17.0"

# SBOM (CycloneDX)
cyclonedx-bom = "0.8.1"

# Sigstore (Keyless Signing)
# https://github.com/sigstore/sigstore-rs/releases/tag/v0.13.0
sigstore = "0.13.0"

# in-toto (Attestations)
in-toto = "0.4.0"

# SLSA Provenance
slsa-provenance = "0.1.0"

# UUID
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# Hex encoding
hex = "0.4.3"

# Base64 (standard with padding, SRI-compatible)
data-encoding = "2.11.0"

# Tokio stream
tokio-stream = "0.1.18"

# tonic-prost-build for proto compilation
tonic-prost-build = "0.14.6"

# tonic-prost runtime (required by generated code)
tonic-prost = "0.14.6"

# ========================================
# Persistence Layer (DuckDB)
# ========================================

# DuckDB - Embedded analytics database
duckdb = { version = "1.10503.0", features = ["bundled"] }

# HTTP server
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6.11", features = [
    "auth",
    "timeout",
    "trace",
    "cors",
    "limit",
    "fs",
] }

# Futures for async streams
futures = "0.3.32"

# ========================================
# Schema Validation
# ========================================

# JSON Schema validation
jsonschema = "0.46.5"

# ========================================
# Observability (OpenTelemetry + Prometheus)
# ========================================

# OpenTelemetry SDK
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }

# Tracing integration with OpenTelemetry
tracing-opentelemetry = "0.33.0"

# Prometheus metrics
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
